name: Build Vampire Client
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "package.json"
      - "src/**"
      - "electron/**"
      - "game-mod/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/build.yml"
permissions:
  contents: write
concurrency:
  group: vampire-client-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game-mod-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12.1
      - name: Build Fabric companion mod
        working-directory: game-mod
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: vampire-client-fabric-mod
          path: game-mod/build/libs/*.jar
          if-no-files-found: error
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable --x64 --publish never
            artifact: windows-x64
          - os: windows-latest
            args: --win nsis portable --ia32 --publish never
            artifact: windows-x86
          - os: ubuntu-latest
            args: --linux AppImage deb --x64 --publish never
            artifact: linux-x64
          - os: macos-latest
            args: --mac dmg zip --universal --publish never
            artifact: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: vampire-client-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, game-mod-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
