name: Build Vampire Client
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "package.json"
      - "src/**"
      - "electron/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/build.yml"
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable --x64
            artifact: windows-x64
          - os: windows-latest
            args: --win nsis portable --ia32
            artifact: windows-x86
          - os: ubuntu-latest
            args: --linux AppImage deb --x64
            artifact: linux-x64
          - os: macos-latest
            args: --mac dmg zip --universal
            artifact: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: vampire-client-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
