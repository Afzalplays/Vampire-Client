name: Build Vampire Client
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "package.json"
      - "src/**"
      - "electron/**"
      - "server/**"
      - "tests/**"
      - "docs/**"
      - ".env.example"
      - "game-mod/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/build.yml"
permissions:
  contents: write
concurrency:
  group: vampire-client-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game-mod-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12.1
      - name: Build Fabric companion mod
        working-directory: game-mod
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: vampire-client-fabric-mod
          path: game-mod/build/libs/*.jar
          if-no-files-found: error
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable --x64 --publish never
            artifact: windows-x64
          - os: windows-latest
            args: --win nsis portable --ia32 --publish never
            artifact: windows-x86
          - os: ubuntu-latest
            args: --linux AppImage deb --x64 --publish never
            artifact: linux-x64
          - os: macos-latest
            args: --mac dmg zip --universal --publish never
            artifact: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-
      - name: Report dependency advisories
        if: runner.os == 'Linux'
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log('npm audit summary:', JSON.stringify(a.metadata?.vulnerabilities)); for (const [name, issue] of Object.entries(a.vulnerabilities || {})) console.log(name, issue.severity, JSON.stringify(issue.via), JSON.stringify(issue.fixAvailable));"
      - run: npm run build
      - name: Run launcher regression tests
        run: npm test
      - name: Package desktop app (retry transient download failures)
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "electron-builder attempt $attempt/5"
            if npx electron-builder ${{ matrix.args }}; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Packaging failed; waiting 45 seconds before retry."
              sleep 45
            fi
          done
          echo "Packaging failed after 5 attempts."
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: vampire-client-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, game-mod-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
